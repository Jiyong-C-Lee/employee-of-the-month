# 조조 팩 상황 저작 원본. `npm run gen`이 packs.gen.ts에 JSON으로 굽는다.
#
# 진행 모델 = 랜덤픽 + sparse 링크:
# - then: [{to, lead}] — 이 상황을 치르면 다음 상황이 후보 중 하나로 확정 연결.
# - branch: 판정이 채택안을 노선(options)으로 분류하고 then[노선]의 후보가 다음이 된다.
# - 후보가 여럿이면 미출현 상황 중 랜덤 — 반복 방지.
# - lead는 앞 판의 결말이 그 상황을 불러오는 보스 말투 도입 문장(브릿지 힌트 + AI 실패 시 폴백).
# - linkedOnly: 링크로만 등장(랜덤 덱 제외).

- id: hanshil-chairman
  text: >-
    국민기업 한실그룹이 내분으로 무너졌고, 창업주 유회장은 비서 한 명 없이 낡은
    오피스텔에서 법인 도장만 지키고 있다 한다. 모셔오면 '국민기업의 적통' 간판으로
    업계를 호령할 수 있지만, 사사건건 어르신 재가를 받는 시늉을 해야 하는 짐이 될
    수도 있다. 본초그룹 원회장도 같은 생각이라는 소문이 돈다.
  question: 유회장님을 모셔와야 하겠나?
  then:
    - to: boncho-ultimatum
      lead: >-
        유회장 건의 결말이 업계에 알려지자, 잠자코 있던 본초 쪽이 드디어 본색을
        드러냈네.

- id: yeopo-apply
  text: >-
    업계 최강 개발자 여포가 지원서를 냈다. 전 직장 두 곳에서 대표를 몰아냈고,
    마지막 회사는 그가 나간 뒤 상장폐지됐다. 면접에서는 '회장님과 저면 업계 평정은
    반년이면 됩니다'라며 연봉으로 임원급을 불렀다. 마침 와 있던 유대표가 '전
    대표들이 어떻게 됐는지는 아시죠'라고 조용히 얹었다.
  question: 여포, 뽑아야 하겠나?
  branch:
    options:
      hire: 여포를 뽑거나, 조건을 달아서라도 들이는 쪽
      reject: 여포를 거절하거나 내치는 쪽
    then:
      hire:
        - to: yeopo-stock-demand
          lead: >-
            그렇게 여포를 들였네. 실적은 소문대로였지. 그런데 석 달 만에, 그자가
            그 실적을 인질로 잡기 시작했어.
      reject:
        - to: yeopo-revenge
          lead: >-
            여포를 돌려보낸 날은 속이 다 시원했는데 말이야. 그자가 어디로 갔는지
            아나?

- id: yeopo-stock-demand
  linkedOnly: true
  text: >-
    입사 석 달 만에 여포가 회장실로 쳐들어왔다. 요구는 CTO 직함과 스톡옵션 1할,
    그리고 개발본부 인사권. 안 주면 팀을 통째로 데리고 나가겠다는 말을 웃으면서
    한다. 실제로 개발본부의 절반은 이미 '여포 사단'으로 불린다. 복도에서 마주친
    유대표가 말없이 고개만 저었다.
  question: 여포의 요구, 들어줘야 하겠나?

- id: yeopo-revenge
  linkedOnly: true
  text: >-
    내쳐진 여포가 본초그룹 기술총괄로 들어갔다는 속보가 떴다. 첫 업무가 우리 핵심
    개발자들에게 연봉 세 배 오퍼를 돌리는 것이었다 한다. 벌써 두 명이 면담을
    신청했고, 개발본부 단톡방은 반나절째 조용하다. 맞오퍼로 지키자니 연봉 체계가
    무너지고, 놓아주자니 기술이 통째로 넘어간다.
  question: 여포의 복수, 어찌 막아야 하겠나?

- id: liubei-shelter
  text: >-
    폐업 직전의 도원컴퍼니 유대표가 관우·장비까지 데리고 몸을 의탁하겠다며 찾아왔다.
    내치면 업계 인재들이 '위그룹은 사람을 버린다'며 등을 돌릴 것이고, 품자니 훗날
    호랑이를 사옥 안에서 키우는 꼴이 될까 걸린다. 그 그릇이 심상치 않음은 나도
    안다. 환영 회식 자리가 이상하게 조용하다.
  question: 유대표를 어떻게 대접하면 좋겠나?
  branch:
    options:
      embrace: 유대표 일행을 품거나 곁에 두는 쪽
      expel: 내치거나 거리를 두는 쪽
    then:
      embrace:
        - to: green-plum
          lead: >-
            유대표를 그렇게 곁에 두고 나니, 영 마음 한구석이 가렵단 말이지. 그러던
            차에 이상한 게 눈에 들어왔어.

- id: wanseong-deal
  text: >-
    완성테크 장대표가 다시 파트너십을 청해왔다. 지난번 제휴 때 그가 계약을 뒤집는
    바람에 맏아들 조앙 본부장이 책임지고 회사를 떠났다. 이번엔 명참모 가후까지
    데리고 와 진심이라 한다. 본초그룹과의 전면전을 앞두고 등 뒤의 적을 줄여야 할
    때인데, 아들을 내보낸 원수의 손을 잡을 수 있겠는가.
  question: 장대표의 손을 다시 잡아야 하겠나?
  then:
    - to: chochung-scale
      lead: >-
        장대표와의 일을 그렇게 정리하고 나니 조앙이 사무치더군. 그래서 요즘 아이들을
        다시 보게 됐는데— 막내가 일을 냈어.

- id: guanwoo-terms
  text: >-
    도원이 무너지며 업계 최고 신망의 관우 본부장이 갈 곳을 잃었다. 입사 조건이
    별나다. 남은 직원들 고용 승계 보장, 그리고 유대표가 재기해 부르면 언제든
    떠나겠다는 것. 시한부 계약이지만 그 실력과 의리가 심히 탐난다. 인사팀은 '언젠가
    떠날 사람에게 사이닝 보너스까지 줄 이유가 없다'며 반대한다.
  question: 관우의 조건부 입사, 받아줄 텐가?
  branch:
    options:
      accept: 조건을 받아 관우를 들이는 쪽
      reject: 조건을 거절하거나 그를 보내는 쪽
    then:
      accept:
        - to: guanwoo-resign
          lead: >-
            관우 건을 그렇게 매듭지었는데, 결국 올 것이 오고야 말았네.

- id: guandu-standoff
  text: >-
    본초그룹과의 점유율 전쟁이 반년째다. 저쪽 실탄은 우리의 세 배가 넘는데 우리
    통장엔 한 달 치 운영비도 안 남았다. 지친 직원들의 퇴사가 늘고, 사내에 본초그룹
    쪽과 몰래 연락하는 움직임이 있다는 보고까지 올라온다. 철수하면 안전하지만
    기세를 잃고, 버티자니 다음 달 월급이 없다.
  question: 철수해야 하나, 버텨야 하나?
  branch:
    options:
      hold: 버티며 싸움을 이어가는 쪽
      retreat: 철수하거나 굽히는 쪽
    then:
      hold:
        - to: heoyu
          lead: >-
            그 결기대로 버텼더니 전선이 교착됐지. 그러다 보니 별일이 다 생겨.
            어젯밤, 뜻밖의 손님이 회장실 문을 두드렸네.

- id: heoyu
  text: >-
    본초그룹의 핵심 재무통 허유가 한밤중에 이직하겠다며 찾아왔다. 저쪽 자금줄의
    위치와 바닥난 실탄 현황까지 꿰고 있으니 정보 가치는 어마어마하다. 문제는 대학
    동창이라고 회장실에서 다리를 꼬고 반말을 하며, 벌써부터 '내가 아니었으면'
    소리를 입에 달았다는 것이다. 정보는 탐나고 사람은 벌써 피곤하다.
  question: 허유를 어떻게 대접해야 하겠나?
  then:
    - to: resume-folder
      lead: >-
        그 밤손님 건 이후 전세가 단숨에 뒤집혔지. 이겼네. 이겼는데— 이긴 자리에서
        이상한 물건이 나왔어.

- id: resume-folder
  text: >-
    본초그룹과의 전쟁에서 기적적으로 이겼다. 그런데 인수한 서버에서, 전쟁이
    불리하던 시기에 우리 임직원들이 저쪽에 보낸 이력서와 입사 지원 메일이 폴더째
    쏟아져 나왔다. 문책하면 회사의 절반을 갈아치울 판이고, 지우면 갈아탈 뻔한 자들이
    그대로 남는다. 임원들이 숨을 죽이고 내 입만 바라보고 있다.
  question: 이 폴더, 어떻게 처리하면 좋겠나?
  then:
    - to: boncho-heirs
      lead: >-
        폴더 소동의 먼지가 가라앉기도 전에, 무너진 본초 쪽에서 집안싸움이 터졌다는
        보고가 올라왔네.

- id: nambu-expansion
  text: >-
    본초그룹까지 정리하고 수도권을 평정했다. 남은 건 형주물산과 강동의 오션그룹뿐.
    대규모 자본으로 남부까지 밀어붙이면 업계 통일이 눈앞이지만, 해운·플랫폼은
    우리가 한 번도 해본 적 없는 물이다. 현지에선 '수도권 방식은 여기서 안 통한다'며
    코웃음 친다는 보고도 있다. 강경론과 신중론이 팽팽하다.
  question: 지금 남부 시장에 들어가야 하겠나?

- id: hwata-consult
  text: >-
    고질인 두통이 심해지는데 화타 컨설턴트의 진단이 나왔다. '두통의 뿌리는 회사
    조직에 있으니 사업부를 다 해체하고 뼈대부터 다시 설계해야 삽니다'라는 처방에,
    견적서엔 컨설팅비만 연 매출의 1할이다. 임원들은 '회사를 주무르려는 수작'이라며
    파기를 요구하지만, 화타가 살려낸 회사 명단은 업계가 다 안다.
  question: 화타의 처방, 받아야 하겠나?

- id: succession-choice
  text: >-
    후계를 정할 때가 왔다. 맏아들 조비는 신중하고 관리에 능해 흠잡을 데 없다. 셋째
    조식은 크리에이티브가 천재적이나 회식이 과하고 출근 시간이 자유분방하다.
    임원들은 두 파로 갈라져 줄서기가 한창이고, 형제는 명절에도 다른 방에서 밥을
    먹는다 한다. 잘못 정하면 본초그룹처럼 형제 소송전이 날 것이다.
  question: 누구에게 회사를 물려줘야 하겠나?
  then:
    - to: brothers-split
      lead: >-
        그렇게 결정을 내렸는데도 집안이 조용해지질 않아. 보다 못한 이사회가 기어이
        칼을 들고 나왔네.

- id: gyeruk
  text: >-
    서부 물류기지 사업이 골칫거리다. 투자금은 이미 절반이 들어갔는데 수익 전망은
    해마다 내려간다. 접자니 들인 돈이 아깝고 쥐고 있자니 남 좋은 일만 하는 판이다.
    회의 중에 무심코 '계륵이군' 하고 중얼거렸더니, 양수 팀장이 그 한마디만 듣고
    벌써 철수 실행안을 전 부서에 돌려버렸다.
  question: 사업은 어찌하고, 멋대로 움직인 양수는 어찌해야 하겠나?

- id: dongjak-tower
  text: >-
    신사옥 동작타워가 완공됐다. 업계 최고층에 옥상 정원과 문학회 전용 홀까지
    넣었더니, 언론이 '불황에 호화 사옥'이라며 연일 때리고 직원들은 구내식당 가격
    인상과 엮어 수군댄다. 준공식을 성대하게 열어 기세를 보여줄 수도, 조용히 입주만
    할 수도 있다. 초대장 인쇄소는 회신만 기다리고 있다.
  question: 준공식, 어떻게 치러야 하겠나?

- id: security-app
  text: >-
    전사에 '업무 중 보안 앱 미설치 적발 시 직급 불문 감봉'이라는 규정을 내가 직접
    만들었다. 그런데 어제 전 직원 앞에서 시연하던 내 폰에 보안 앱이 없다는 게
    들통났다. 신상필벌을 외쳐온 처지라 그냥 넘기면 규정이 우스워지고, 회장이 스스로
    벌을 받자니 모양이 빠진다. 사내 게시판은 벌써 시끄럽다.
  question: 나 자신을 어떻게 처분해야 하겠나?

- id: jangsong-data
  text: >-
    익주식품 내부 기획자 장송이 시장 데이터 전체를 들고 협력을 제안하러 왔다. 물건은
    진품인데 태도가 문제다. 첫 대면에서 '위그룹 전략이 후지다는 건 업계가 다
    압니다'라며 훈수를 두는 통에 회의장이 얼어붙었다. 내치면 저 데이터가 경쟁사로
    가고, 받자니 저 입을 매일 봐야 한다.
  question: 장송과 그 데이터, 받아야 하겠나?

- id: yeonpanjang
  text: >-
    사내 감사에서 '회장 퇴진 요구' 비밀 연판장이 발견됐다. 서명자가 스물넷인데, 명단
    끝에 하필 한실그룹 유회장의 사위인 동승 전무 이름이 있다. 전원 문책하면
    한실그룹과의 관계가 터지고 국민 여론도 위험하다. 덮자니 연판장이 어디까지
    돌았는지 알 수 없다. 인사팀장은 명단을 들고 손을 떨고 있다.
  question: 이 연판장, 어떻게 처리해야 하겠나?

- id: maesil
  text: >-
    지방 워크숍에서 지친 직원들에게 '이 고개만 넘으면 매실밭이 있다. 조금만
    버티자'라고 즉석연설을 했는데, 매실밭은 없었다. 사기는 그날 올랐지만 한 직원이
    연설 영상을 올리면서 '희망고문 리더십' 논란이 터졌다. 밈은 커지는데 사과하면
    리더십이 흔들리고, 버티면 놀림이 길어진다.
  question: 이 매실밭 논란, 어떻게 수습해야 하겠나?

- id: hiring-notice
  text: >-
    인사팀이 파격 채용공고 초안을 올렸다. '학벌·전과·평판 안 봅니다. 실력만
    봅니다.' 인재가 마른 시국에 업계의 숨은 실력자들을 쓸어올 수 있는 안이지만,
    법무팀은 '전과자 우대냐는 기사가 하루 만에 나온다'며 결사반대다. 초안 그대로
    내면 화제성은 보장인데, 뒷감당도 보장이다.
  question: 이 채용공고, 그대로 내야 하겠나?
  then:
    - to: yeopo-apply
      lead: >-
        채용공고 소동이 그렇게 정리되자 업계가 술렁이더니, 굴러들어온 첫 이력서부터
        물건이야. 그것도 아주 위험한 물건.
    - to: sima-candidate
      lead: >-
        공고가 나가고 이력서가 쏟아졌는데, 그중 하나가 자꾸 눈에 밟혀. 실력은
        나무랄 데가 없는데— 어딘가 서늘한 자야.

- id: seoseo-scheme
  text: >-
    도원컴퍼니의 핵심 기획자 서서를 스카우트하고 싶은데 본인이 '유대표 곁을 떠날 수
    없다'며 요지부동이다. 그런데 인사팀이 묘수라며 가져온 안이 걸린다. 서서의 모친이
    우리 계열 요양원 VIP 고객이니, 모친 명의의 초청 행사를 열면 서서가 제 발로
    온다는 것이다. 유능한 건 알겠는데 이건 스카우트인가 인질극인가.
  question: 이 영입안, 승인해야 하겠나?

- id: short-life-poem
  text: >-
    신년사에 넣은 내 자작시 '짧은 인생, 술잔이나 들게'가 사내 밈이 됐다. 회식
    건배사로, 퇴근 인사로, 심지어 지각 사유서에까지 인용되고 있다 한다. 문학회는
    '회장님 시집을 내자'며 들떠 있고, 홍보팀은 '음주 조장 이미지'라며 말린다. 웃자고
    넘기기엔 이미 너무 퍼졌다.
  question: 이 시, 밀어야 하겠나 묻어야 하겠나?

- id: boncho-ultimatum
  text: >-
    본초그룹 원회장이 최후통첩을 보내왔다. 유회장 간판을 내리고 본초 계열로 들어오면
    지분과 수도권 시장 절반을 보장하겠다는 것. 거절하면 전면전인데 저쪽 실탄은
    우리의 세 배다. 임원 절반은 '일단 굽히고 힘을 기르자' 하고, 절반은 '국민기업
    적통 간판을 내리는 순간 우리는 끝'이라 한다. 답신 기한은 내일 아침이다.
  question: 본초의 제안, 받아야 하겠나?
  branch:
    options:
      fight: 제안을 거절하고 맞서는 쪽
      submit: 제안을 받거나 일단 굽히는 쪽
    then:
      fight:
        - to: guandu-standoff
          lead: >-
            그 답신 이후로 본초와는 돌아올 다리가 없어졌지. 전쟁이란 게 시작은
            요란한데, 버티는 쪽은 지루하고 피가 마르더군.

- id: boncho-heirs
  text: >-
    본초그룹이 무너지자 원회장의 두 아들이 남은 계열사를 반씩 쥐고 소송전에
    들어갔다. 지금 개입하면 헐값에 흡수할 수 있지만 '남의 집안 초상에 숟가락
    얹는다'는 여론이 부담이다. 관망하자니 모양은 좋은데, 저 둘이 화해라도 하는 날엔
    다 잡은 고기를 놓친다. 형제는 오늘도 법원 앞에서 따로 기자회견을 열었다.
  question: 지금 들어가야 하겠나, 기다려야 하겠나?

- id: green-plum
  text: >-
    익명 직장인 커뮤니티에 '업계 판도를 쥘 차기 인물' 투표가 돌았는데, 1위가 남의
    회사도 아니고 우리 사옥에 얹혀사는 유대표고 내가 2위다. 마침 분기 회식에서
    옆자리가 되길래 '요즘 업계에 영웅이 자네와 나 말고 또 있나' 하고 슬쩍 던져봤다.
    유대표는 낯빛이 하얘지더니 잔을 엎고는 '손목이 요즘 좀'이라며 물티슈만 찾았다.
    저게 진짜 그릇이 못 되는 것인지, 못 되는 척인지 알 수가 없다.
  question: 유대표, 그릇인가 겁쟁이인가 — 어찌 대해야 하겠나?
  then:
    - to: guanwoo-terms
      lead: >-
        그 회식 자리 이후로도 유대표 쪽 사람들이 자꾸 눈에 밟혀. 이번엔 그 오른팔이
        문제야.

- id: guanwoo-resign
  linkedOnly: true
  text: >-
    유대표가 재기해 사람을 모은다는 소식이 돌기 무섭게, 관우 본부장이 그간 받은
    보너스를 전부 반납하며 사직서를 냈다. 입사 때 약속한 조건이니 잡을 명분이
    없는데, 인사팀은 '경쟁사로 가는 핵심 인재를 순순히 보내는 전례를 만들면 안
    된다'며 가처분이라도 걸자 한다. 약속을 지키면 사람을 잃고, 약속을 깨면 신의를
    잃는다.
  question: 관우를 보내야 하겠나?
  then:
    - to: seoseo-scheme
      lead: >-
        관우 일로 데인 인사팀이 이를 갈았는지, 이번엔 수단을 안 가리는 영입안을 들고
        왔어.

- id: guo-jia-memorial
  text: >-
    최연소 전략실장 곽가가 회의 중에 쓰러졌다. 진단서엔 과로, 의사 소견은 최소 반년
    요양. 지난 세 번의 승부수가 전부 그 머리에서 나왔는데, 사내에선 '천재 한 명 갈아
    넣어 돌아가는 회사'라는 자조가 돌고 전략실은 다음 분기 계획을 못 잡고 있다. 대체
    영입이냐, 조직 재편이냐, 기다림이냐.
  question: 전략실의 구멍, 어떻게 메워야 하겠나?
  then:
    - to: sima-candidate
      lead: >-
        곽가의 빈자리가 이렇게 클 줄이야. 그 자리를 메울 만한 자가 딱 하나
        나타났는데— 이게 또 사람을 고민하게 만들어.

- id: sima-candidate
  text: >-
    새 기획본부장 최종 후보로 사마의가 올라왔다. 실력 검증은 끝났고 흠잡을 데가
    없는데, 면접관 전원이 평가서에 같은 말을 적었다. '눈빛이 서늘하다. 답을 다
    알면서 절반만 말하는 느낌.' 인사팀장은 '이런 사람은 회사를 섬기는 게 아니라 때를
    기다립니다'라며 반대한다. 그러나 이만한 인재가 시장에 다시 나올 것 같지도 않다.
  question: 사마의, 들여야 하겠나?

- id: chochung-scale
  text: >-
    협력사가 납품한 대형 설비의 실중량이 계약과 다르다는 의혹이 터졌는데, 다들 사흘째
    '전문 계측 업체 견적이 얼마' 타령만 하고 있다. 그런데 인턴십 중이던 막내 조충이
    납품 트럭들의 고속도로 과적 단속 계량 기록을 떼와 반나절 만에 끝내버렸다.
    임원들이 '후계는 막내'라며 술렁이고, 형들의 눈빛이 달라졌다. 재능은 귀한데,
    스무 살도 안 된 아이를 정치판 한복판에 세우는 꼴이 될까 걸린다.
  question: 막내의 재능, 어디까지 키워야 하겠나?
  then:
    - to: chosik-incident
      lead: >-
        막내 얘기가 잦아들기도 전에, 이번엔 셋째가 사고를 쳤네.

- id: chosik-incident
  text: >-
    셋째 조식이 밤샘 회식 끝에 법인차를 몰고 사옥 정문 광장을 질주하는 영상이
    유출됐다. 그 문은 창업 때부터 '회장도 걸어서 지난다'는 회사의 상징이라 사내가
    뒤집혔다. 원칙대로 치면 총애하는 천재 아들을 제 손으로 후계 경쟁에서 밀어내는
    셈이고, 덮으면 신상필벌이 우스워진다. 조식은 사과문 대신 시를 한 편 올렸다.
  question: 조식을 어떻게 처분해야 하겠나?
  then:
    - to: succession-choice
      lead: >-
        아이들 일이 연달아 터지고 나니 더는 미룰 수가 없게 됐어. 정할 때가 온 게야.

- id: brothers-split
  linkedOnly: true
  text: >-
    형제의 갈등이 길어지자 이사회가 절충안을 올렸다. 계열을 갈라 각자 대표를 맡기고
    지주사로 묶자는 것. 갈라 앉히면 소송전은 피하겠지만 회사가 둘로 쪼개진 채 굳어질
    것이고, 한 지붕에 두자니 언제 터질지 모른다. 두 아들 쪽 임원들은 이미 명함
    색부터 다르다.
  question: 갈라야 하겠나, 붙여둬야 하겠나?
