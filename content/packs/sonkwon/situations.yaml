# sonkwon 팩 상황 저작 원본. `npm run gen`이 packs.gen.ts에 JSON으로 굽는다.
# 진행 모델 = 랜덤픽 + sparse 링크. 형식은 caocao/situations.yaml 참조.

- id: hunting-letter
  text: >-
    위그룹 조회장이 '함께 강동 시장에서 사냥이나 하자'는 제목의 합병 제안서를 보내왔다. 사실상 회사를 통째로 내놓으라는 최후통첩인데, 장소 고문을 비롯한
    원로들은 벌써 조건 좋을 때 손잡자며 매각 시뮬레이션을 돌리고 있다. 회의 탁자 위에는 내가 방금 문구용 칼로 깎아낸 책상 모서리 조각이 수북하다.
  question: 싸우자니 체급이 다르고 접자니 아버님과 형님 얼굴이 떠오르는데, 자네라면 이 제안서에 뭐라고 답장하겠나?
  branch:
    options:
      fight: 제안을 거절하고 맞서는 쪽
      submit: 매각·타협 쪽
    then:
      fight:
        - to: fire-marketing
          lead: 그 답장을 보낸 뒤로 위그룹과의 정면 승부는 피할 수 없게 됐지. 마침 적벽 프로젝트 수주전이 잡혔는데— 주유 실장이 일을 벌였네.
- id: hyungju-lease
  text: >-
    도원컴퍼니 유대표가 '잠깐만 쓰고 돌려주겠다'며 빌려 간 형주 지사 사옥을 벌써 삼 년째 반납하지 않고 있다. 내용증명을 보낼 때마다 '서쪽 사업이 자리
    잡으면'이라는 똑같은 답장만 온다. 어제는 그 건물 1층에 도원컴퍼니 직영 카페가 개업했다는 사진까지 제보로 들어왔다.
  question: 떼인 건물을 받아내야 곳간이 사는데, 동맹은 깨기 싫단 말이지. 자네라면 어떻게 받아내겠나?
  branch:
    options:
      force: 실력 행사로 받아내는 쪽
      talk: 협상·압박으로 푸는 쪽
    then:
      force:
        - to: baekui-plan
          lead: 받아내기로 마음을 굳혔다는 얘기가 새 나갔는지, 여몽 본부장이 기다렸다는 듯 서류 봉투를 들고 왔네. 표지부터 심상치 않아.
      talk:
        - to: jegalgeun-nego
          lead: 말로 풀기로 하고 협상 대표를 세웠는데— 인선이 하필 그렇게 됐네. 상대편 대표 명단을 보고 나는 웃어야 할지 몰랐어.
- id: bangtong-interview
  text: >-
    신입 공채 최종 면접에 나타난 방통이라는 지원자가 이력서는 업계 전설급인데 면접 태도가 불량하기 짝이 없다. 다리를 꼬고 앉아 하품을 하더니 우리 회사
    전략의 허점 세 개를 줄줄 읊고는 '고칠 생각 있으면 연락 달라'며 먼저 일어났다. 인사팀은 무례하다며 탈락을 올렸지만, 그가 짚은 허점 세 개가 전부
    정곡이라는 게 문제다.
  question: 인재라면 사족을 못 쓰는 나지만 저 태도는 영 거슬리는데, 자네라면 뽑겠나 떨어뜨리겠나?
- id: fire-marketing
  text: >-
    위그룹과의 적벽 프로젝트 수주전이 코앞인데, 주유 실장이 프레젠테이션 전체를 오케스트라 공연으로 구성하는 '화공 마케팅' 기획서를 올렸다. 예산이 분기
    홍보비의 세 배인 데다 리허설 도중 무대 소품에 진짜 불이 붙어 소방서가 다녀갔다. 그런데 심사위원단이 공연형 발표를 선호한다는 첩보도 사실이긴 하다.
  question: 화끈하게 지르자니 곳간이 울고 아끼자니 수주를 놓칠 판인데, 이 불장난 기획서에 결재를 해줘야 하나?
  then:
    - to: hwanggae-plan
      lead: 화공 기획 결재가 그렇게 정리되자, 이번엔 칠순 잔치를 막 끝낸 어르신이 결재판을 들고 오셨네. 서류 제목부터 심상치 않아.
- id: nosuk-promise
  text: >-
    노숙 이사가 도원컴퍼니와의 협력 만찬에서 분위기에 취해 우리 창고 부지 절반을 '우선 협상 대상'으로 구두 약속하고 왔다. 본인은 큰 그림이라며 웃는데
    재무팀은 장부를 끌어안고 울고 있다. 도원컴퍼니 쪽에서는 벌써 감사 답례로 죽순 선물세트를 보내왔다.
  question: 사람 좋은 게 죄는 아니라지만 이번엔 선을 넘었는데, 구두 약속을 물리자니 노이사 얼굴이 밟히고. 자네라면 어찌 수습하겠나?
- id: habi-nightmare
  text: >-
    합비 지역 영업에서 위그룹 장료 이사에게 또 참패했다. 우리 영업 인력이 열 배나 많았는데도 장료 이사가 새벽에 거래처 여덟 곳을 돌며 판을 뒤집었고,
    이제 합비 상인들은 우리 회사 배지만 봐도 계약서를 덮는다는 소문이 돈다. 사내에서는 '합비의 악몽'이라는 단어가 금지어가 됐다.
  question: 그 이름만 들어도 내 위장이 아픈데, 합비를 포기할 수는 없단 말이지. 이 징크스를 어떻게 깨면 좋겠나?
- id: baekui-plan
  text: >-
    여몽 본부장이 도원컴퍼니 관우 지사장이 자리를 비운 틈에 형주 지사를 기습 인수하는 '백의종군 작전' 기획서를 올렸다. 직원들을 택배 기사로 위장시켜
    접수한다는 계획이 소름 돋게 치밀한데, 성공하면 삼 년 묵은 체증이 내려가지만 도원컴퍼니와의 동맹은 그날로 끝장이다. 기획서 표지에는 '읽고
    태워주십시오'라고 적혀 있다.
  question: 떼인 건물을 되찾을 천재일우의 기회인데 동맹 파기 책임은 내가 뒤집어쓰게 생겼단 말이지. 자네라면 이 기획서에 도장을 찍겠나?
  branch:
    options:
      execute: 기습 인수를 승인하는 쪽
      reject: 기획을 반려하는 쪽
    then:
      execute:
        - to: yukson-strategy
          lead: 그 작전의 후폭풍이 기어이 왔네. 도원 쪽이 회사의 명운을 건 보복 소송을 걸어왔어. 그런데 대응 전략을 올린 게— 신입급이야.
- id: sister-marriage
  text: >-
    여동생 손상향이 도원컴퍼니 유대표와 전격 결혼을 발표해 업계가 발칵 뒤집혔다. 정략결혼으로 동맹을 굳히자던 원로들의 계획이었는데, 정작 동생은 진심으로
    눈이 맞아버렸고 신혼집에 우리 회사 기밀 서류를 가져가려다 경호팀에 걸렸다. 기자들은 '오션그룹, 사돈 회사에 흡수되나'라는 제목을 뽑아놓고 대기 중이다.
  question: 가족은 가족이고 회사는 회사인데 그 둘이 한 상에 앉아버렸으니, 이 혼사를 어느 선까지 밀어줘야 하겠나?
- id: hwanggae-plan
  text: >-
    원로 황개 고문이 적벽 수주전을 위해 자신이 위그룹으로 위장 이직해 내부 정보를 빼 오겠다는 '고육지계' 은퇴 번복서를 제출했다. 칠순 잔치를 막 끝낸
    분이 위장 이직이라니 다들 말리는데, 본인은 이미 위그룹 인사팀과 면접 일정까지 잡아놨다. 심지어 그럴듯하게 보이려고 나한테 공개 석상에서 혼나는 각본까지
    써 왔다.
  question: 충심은 눈물겹지만 어르신이 다치면 내가 천하의 불효자가 되는 판인데, 이 각본대로 연기를 해줘야 하나?
- id: rivals-tf
  text: >-
    감녕 팀장과 능통 과장이 회식 자리에서 또 붙었다. 감녕 팀장이 주먹 시절 능통 과장의 부친 회사를 무너뜨린 원한이 있는데, 하필 이번 신사업 TF에 둘이
    나란히 배정됐다. 어제는 탕비실에서 마주쳐 정수기를 사이에 두고 삼십 분을 대치했다고 한다.
  question: 둘 다 놓치기 아까운 인재인데 한 방에 두면 사무실이 격투기장이 된단 말이지. 이 원수지간을 어떻게 한 팀으로 굴리겠나?
  then:
    - to: gamnyeong-raid
      lead: 그 두 사람 문제를 그렇게 정리해놨더니, 이번엔 감녕 팀장이 혼자서 일을 냈네. 그것도 아주 요란하게.
- id: beer-scandal
  text: >-
    젊은 총수 이미지 쇄신을 위해 시작한 사내 소통 프로그램 '회장님과 맥주 한잔'이 문제가 됐다. 내가 취해서 우번 부장에게 '내 술을 안 받아?'라며 세
    번이나 잔을 강권하는 영상이 익명 게시판에 올라온 것이다. 댓글에는 '선대 회장님은 안 그러셨다'는 말이 좋아요 1위를 달리고 있다.
  question: 소통하려다 꼰대가 됐는데, 사과문을 쓰자니 총수 체면이 말이 아니고. 자네라면 이 술자리 사태를 어떻게 덮겠나?
- id: son-comment
  text: >-
    위그룹 조회장이 업계 신년회에서 나를 가리키며 '아들을 낳으려면 저런 아들을 낳아야지'라고 말한 게 기사화됐다. 칭찬 같기도 하고 아랫사람 취급 같기도
    해서 밤새 잠을 못 잤는데, 우리 홍보팀은 '업계 1위가 인정한 경영 능력'이라며 보도자료를 내자고 한다. 원로들은 감히 회장님을 아들 취급했다며 항의
    공문을 쓰는 중이다.
  question: 웃어넘기면 얕보이고 발끈하면 속 좁아 보이는데, 자네라면 이 발언에 어떻게 응수하겠나?
- id: yukson-strategy
  text: >-
    육손 담당이 도원컴퍼니의 대규모 보복 소송 '이릉의 난'에 대한 대응 전략을 올렸는데, 초반 여섯 달 동안 일부러 연전연패하며 상대 소송비를 말려 죽이는
    지연전이다. 이사회는 신입급 직원의 전략에 회사 명운을 걸 수 없다며 부결 직전이고, 육손 본인은 화분에 물을 주며 '급할수록 천천히'라는 말만 반복한다.
    첫 공판이 다음 주다.
  question: 판 전체를 보는 눈은 저 친구가 제일인데 직급이 발목을 잡는군. 자네라면 이 애송이 소리 듣는 천재에게 전권을 주겠나?
- id: ugil-tent
  text: >-
    유명 점술사 우길 도사가 사옥 앞에 천막을 치고 '오션그룹의 기운이 다했다'며 액막이 굿판을 열어 직원들이 출근길마다 부적을 사고 있다. 형님이 생전에
    이런 미신을 극도로 싫어해 점술사를 쫓아냈다가 저주 괴담에 시달린 흑역사가 있어서 함부로 건드리기도 찝찝하다. 오늘 아침엔 인사팀장까지 책상에 부적을
    붙여놨다.
  question: 미신이라고 무시하자니 사기가 흔들리고 모셔다 굿을 하자니 총수 체면이 우스운데, 저 천막을 어찌하면 좋겠나?
- id: succession-factions
  text: >-
    차기 후계 구도를 놓고 사내가 두 쪽 났다. 장남을 미는 파벌과 삼남을 미는 파벌이 각자 회의실을 잡고 세미나를 여는 지경인데, 정작 나는 아직 은퇴
    생각이 눈곱만큼도 없다. 어제는 두 파벌이 구내식당 배식 줄까지 따로 서는 걸 보고 말았다.
  question: 멀쩡히 살아 있는 총수 앞에서 후계 다툼이라니 이런 괘씸한 일이 있나. 이 파벌 놀음을 어떻게 잠재우겠나?
- id: iju-expedition
  text: >-
    신사업으로 추진하던 해외 이주 프로젝트 '이주(夷州) 개척단'이 반년 만에 투자금 절반을 까먹고 돌아왔다. 얻은 것이라곤 현지 특산품 견과류 세 상자와
    '거긴 사람 살 곳이 아니다'라는 보고서뿐이다. 이 프로젝트는 원로들이 전원 반대했는데 내가 젊은 감각을 보여주겠다며 밀어붙인 것이라 더 뼈아프다.
  question: 내 얼굴에 책임이라고 적혀 있는 것 같은데, 손절하자니 판단 착오를 인정하는 꼴이고. 이 개척단을 어떻게 마무리하겠나?
- id: gamnyeong-raid
  text: >-
    감녕 팀장이 위그룹의 대형 거래처 마흔 곳이 모이는 만찬장에 부하 백 명만 데리고 잠입해 하룻밤 만에 열두 곳과 가계약을 맺고 돌아왔다. 쾌거는 쾌거인데
    그 과정에서 위그룹 영업본부장의 축사 도중 방울을 흔들며 난입했다는 제보가 있고, 위그룹 법무팀이 업무방해로 내용증명을 예고했다. 본인은 '작전
    성공'이라며 비단 옷을 입고 출근했다.
  question: 상은 줘야겠고 벌도 줘야겠는 이 애매한 전과를 자네라면 어떻게 처리하겠나?
- id: jegalgeun-nego
  text: >-
    제갈근 이사가 도원컴퍼니와의 형주 임대료 협상 대표로 나갔는데, 상대측 대표가 하필 친동생 제갈량이다. 형제는 공과 사를 구분한다며 협상장에서 존댓말로
    명함을 교환했고, 협상은 사흘째 한 발짝도 못 나갔다. 업계에서는 '형제의 난'이라며 중계하듯 지켜보는 중이고, 제갈근 이사는 어제 처음으로 병가를 냈다.
  question: 협상 대표를 바꾸자니 제이사 자존심이 무너지고 두자니 세월아 네월아인데, 자네라면 어느 쪽을 택하겠나?
- id: paper-approval
  text: >-
    창업 공신인 정보 고문이 회의 때마다 '아버님 대엔 이랬다'며 모든 안건을 삼십 년 전 방식으로 되돌리려 한다. 이번에는 전사 결재 시스템을 다시 종이
    결재로 바꾸자는 상소를 올렸는데, 서명란에 원로 열두 명의 이름이 나란히 적혀 있다. 무시하자니 창업 공신들이고 들어주자니 회사가 삼십 년 전으로 돌아갈
    판이다.
  question: 어른들 공경과 회사의 앞날 사이에서 줄타기가 고단하군. 이 종이 결재 상소문에 뭐라고 답하겠나?
- id: festival-stage
  text: >-
    업계 삼분지계의 상징으로 삼 사가 공동 출자한 '천하삼분 페스티벌'이 다음 달인데, 개막식 무대 중앙 자리를 놓고 위그룹과 도원컴퍼니가 벌써 자리싸움을
    시작했다. 주최측 자격으로 중재하다가 잘못하면 양쪽에 다 밉보이고, 어느 한쪽 편을 들면 나머지 한쪽과 등지게 된다. 무대 도면에는 아직 중앙 자리가
    공란으로 남아 있다.
  question: 낄 자리 빠질 자리를 아는 게 내 생존 비결인데 이번엔 빠질 구멍이 없군. 이 자리 배치를 어떻게 정리하겠나?
