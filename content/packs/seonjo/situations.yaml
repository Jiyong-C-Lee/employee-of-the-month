# seonjo 팩 상황 저작 원본. `npm run gen`이 packs.gen.ts에 JSON으로 굽는다.
# 진행 모델 = 랜덤픽 + sparse 링크. 형식은 caocao/situations.yaml 참조.

- id: two-reports
  text: >-
    왜그룹의 침공이 임박했다는 첩보가 돈다. 실태 파악차 보낸 시찰단 두 명이 돌아왔는데 보고가 정반대다. 한 명은 '전면 침공 준비가 끝났다, 당장 대비해야
    한다'고 하고, 다른 한 명은 '엄포일 뿐, 소란 떨면 시장만 흔들린다'고 한다. 같은 곳을 보고 온 두 사람의 보고서가 표지 색깔까지 다르다.
  question: 어느 보고를 믿고 움직여야 하겠소?
  branch:
    options:
      dismiss: 엄포로 보고 대비하지 않는 쪽
      prepare: 침공에 대비하는 쪽
    then:
      dismiss:
        - to: hq-retreat
          lead: 엄포라던 보고를 믿은 값을 이리 빨리 치를 줄 몰랐소. 왜그룹이 진짜로 밀고 올라왔고, 비서실이 조용히 보고서 하나를 올렸소.
      prepare:
        - to: hullyeondogam
          lead: 대비하자는 보고를 믿기로 하니, 기다렸다는 듯 상설 조직 신설안이 올라왔소. 돈 얘기가 붙어서 왔소.
- id: hq-retreat
  text: >-
    왜그룹이 남부 시장을 순식간에 집어삼키며 북상 중이다. 비서실이 조용히 올린 보고서에는 본사를 북부 의주 방면으로 이전하는 세 가지 시나리오가 담겨 있다.
    옮기면 살지만 '회장이 서울을 버렸다'는 말이 나올 것이고, 버티자니 본사가 함락되면 회사의 법통이 끊긴다. 보고서 겉장에는 '대외비, 열람 즉시
    소각'이라 적혀 있다.
  question: 본사 이전, 준비해야 하겠소?
  branch:
    options:
      move: 본사 이전을 준비하는 쪽
      stay: 서울 사수 쪽
    then:
      move:
        - to: hq-fire
          lead: 이전 검토 소문이 어디서 샜는지, 기어이 일이 터졌소. 한밤중에 전화가 왔는데— 본사에 불이 났다 하오.
- id: sunshin-win
  text: >-
    남해본부 이순신 본부장이 또 이겼다. 열두 개 지점만 남은 상태에서 왜그룹의 대규모 공세를 막아냈고, 언론은 연일 '조선물산의 구원자'라며 그의 특집
    기사를 쏟아낸다. 오늘 자 신문 일 면에 그의 사진이 실렸는데 내 사진보다 두 배 크다. 축전을 보내자니 속이 쓰리고, 침묵하자니 옹졸하다는 말이 나올
    판이다.
  question: 이 승전보, 어떻게 치하해야 하겠소?
  then:
    - to: wongyun-letter
      lead: 축전 문제를 그렇게 정리하자마자, 기다렸다는 듯 장문의 투서가 올라왔소. 발신인 이름을 보고 붓을 놓았소.
- id: wongyun-letter
  text: >-
    원균 영업본부장이 장문의 투서를 올렸다. 이순신 본부장이 명령 체계를 무시하고 독단으로 움직이며, 공을 독차지하려 전투를 골라서 한다는 내용이다. 사실
    확인은 안 되지만 듣기에 싫지 않은 내용이라 더 문제다. 인사팀은 '전시 지휘부 교체는 자살 행위'라는 의견을 조심스럽게 붙여 왔다.
  question: 이 투서, 어떻게 처리해야 하겠소?
- id: ming-condition
  text: >-
    대주주인 명그룹에 구원 요청을 넣었더니 답이 왔다. 지원군은 보내주겠는데 조건이 붙었다. 지원 비용 정산, 주요 의사결정 사전 협의, 그리고 협상
    테이블에서 왜그룹과 우리 시장을 나눠 갖는 안도 검토할 수 있다는 것이다. 남의 손을 빌리자니 회사가 반쪽 나고, 안 빌리자니 버틸 힘이 없다.
  question: 명그룹의 조건, 받아야 하겠소?
  branch:
    options:
      accept: 명그룹의 조건을 받는 쪽
      refuse: 거절하고 자력으로 버티는 쪽
    then:
      accept:
        - to: ming-audit
          lead: 명그룹 손을 잡은 대가가 생각보다 빨리 왔소. 감사단이 내려온다는 공문이오. 명목은 감사인데— 행간이 수상하오.
- id: gwanghae-heir
  text: >-
    이사회가 광해 전무의 후계 확정을 요구하고 나섰다. 전시에 회장 유고 시 회사가 표류한다는 명분인데, 막상 후계를 확정하면 임원들이 저쪽으로 줄을 설 게
    뻔하다. 광해 전무는 위기 대응에서 능력을 보여 인망까지 얻고 있다. 그게 든든하기보다 서늘하게 느껴지는 요즘이다.
  question: 후계 확정, 지금 해야 하겠소?
- id: militia-traders
  text: >-
    본사가 손을 놓은 남부 상권에서 대리점주들이 자발적으로 '의병 상단'을 꾸려 왜그룹 유통망을 막아내고 있다. 언론은 미담으로 대서특필 중인데, 본사
    입장에선 고맙지만 뼈아프다. 본사보다 잘 싸우는 자경단이라니. 포상하자니 본사의 무능이 공식화되고, 모른 척하자니 민심이 떠난다.
  question: 의병 상단, 어떻게 대해야 하겠소?
- id: hq-fire
  text: >-
    한양 본사 사옥이 불탔다. 그런데 화재 원인 조사 결과가 곤혹스럽다. 왜그룹의 방화가 아니라, 본사 이전 소문에 분노한 일부 직원들의 소행이라는 정황이
    나온 것이다. 발표하면 회사 내부 분열이 만천하에 드러나고, 왜그룹 소행으로 두면 언젠가 진상이 터진다. 조사관은 보고서 두 가지 버전을 들고 왔다.
  question: 화재 조사 결과, 어떻게 발표해야 하겠소?
  then:
    - to: coup-list
      lead: 불탄 자리의 재가 채 식기도 전에, 감사실이 그보다 더 흉한 것을 캐냈소.
- id: sixth-resign
  text: >-
    위기 대응이 도마에 오를 때마다 써온 카드가 있다. '이 모든 것이 부덕의 소치이니 회장직에서 물러나겠다'는 사의 표명이다. 그때마다 임원들이 만류하는
    그림으로 위기를 넘겼는데, 이번이 벌써 다섯 번째라 약발이 예전 같지 않다. 비서실은 '이번에 진짜 수리하겠다는 임원이 나올 수 있다'는 리스크 보고를
    올렸다.
  question: 여섯 번째 사의 표명, 해야 하겠소 말아야 하겠소?
- id: dorumuk
  text: >-
    피난 시절 임시 본사에서 먹었던 이름 없는 생선이 그렇게 맛있어서 '은어'라는 이름까지 하사했는데, 서울로 돌아와 다시 먹어보니 그 맛이 아니었다. '도로
    묵이라 해라' 한마디가 사내에 퍼져 밈이 됐고, 식품사업부는 이 일화를 통째로 브랜드화한 '도루묵' 제품 라인을 내자고 한다. 회장의 흑역사가 상품이 되는
    셈이다.
  question: 도루묵 브랜드, 승인해야 하겠소?
- id: truce-offer
  text: >-
    왜그룹이 돌연 휴전 협상을 제안해왔다. 남부 시장의 절반을 인정해주면 북상을 멈추겠다는 것이다. 받으면 당장의 안위는 보장되지만 시장 절반을 떼주는
    굴욕이고, 거절하면 전면전이 계속된다. 협상단 명단을 짜는 것부터가 문제다. 강경파를 보내면 판이 깨지고, 온건파를 보내면 다 내주고 올 판이다.
  question: 휴전 협상, 응해야 하겠소?
  then:
    - to: swap-nego
      lead: 협상 테이블이 한번 열리니 의제가 하나둘 늘어나오. 이번엔 돈이 아니라 사람 문제요.
- id: coup-list
  text: >-
    감사실이 사내 쿠데타 모의를 적발했다. 중간 간부 이몽학이 '무능한 경영진을 갈아엎자'며 세를 모으다 걸린 것이다. 가담자 명단이 생각보다 길고, 그중엔
    실적 좋은 인재도 여럿이다. 전원 해고하면 전력에 구멍이 나고, 주동자만 자르면 기강이 서질 않는다. 명단은 지금 내 서랍 안에 있다.
  question: 가담자들, 어디까지 쳐내야 하겠소?
- id: ming-audit
  text: >-
    지원군을 보낸 명그룹에서 감사단이 내려왔다. 지원 자금 사용처를 본다는 명목인데 실상은 대접받으러 온 기색이 역력하다. 요구 사항이 날로 늘어 접대비가
    지원금을 따라잡을 지경이고, 어제는 감사단장이 '남해본부장을 우리 그룹에 파견 보내라'는 말까지 흘렸다. 심기를 거스르면 지원이 끊긴다.
  question: 이 감사단, 어떻게 다뤄야 하겠소?
- id: hullyeondogam
  text: >-
    전란을 겪고 나니 상시 보안 조직이 없다는 게 뼈아프다. 정예 경비 인력을 상설로 두는 '훈련도감' 신설안이 올라왔는데, 인건비가 만만찮다. 재정팀은
    '전쟁 끝나면 놀리는 조직'이라 반대하고, 보안팀은 '전쟁 끝나고 만들면 늦는 조직'이라 맞선다. 왜그룹은 아직 남해에 주둔 중이다.
  question: 훈련도감 신설, 해야 하겠소?
- id: statement-draft
  text: >-
    전시 사보에 실릴 회장 담화문 초안이 올라왔다. 홍보팀 초안은 '회장은 여러분과 끝까지 함께한다'는 감동 노선인데, 하필 지난달 본사 이전 검토 보고서가
    유출된 터라 '함께한다'는 문구가 역풍을 맞을 수 있다. 그렇다고 담화를 안 내면 침묵이 더 흉흉한 소문을 만든다.
  question: 담화문, 어떤 논조로 내야 하겠소?
- id: swap-nego
  text: >-
    왜그룹에 억류된 파견 직원들 송환 협상이 시작됐다. 저쪽 요구는 몸값이 아니라 우리 쪽에 넘어온 왜그룹 출신 경력직들과의 맞교환이다. 문제는 그 경력직들이
    지금 우리 핵심 부서에서 일 잘하고 있다는 것이다. 내 사람을 찾자니 데려온 사람을 내줘야 하고, 거절하자니 억류 직원 가족들이 본사 앞에서 농성 중이다.
  question: 맞교환 협상, 받아야 하겠소?
- id: reward-list
  text: >-
    전쟁이 끝나고 논공행상의 시간이 왔다. 인사팀이 올린 초안을 보니 전장에서 싸운 공로자보다 피난길에 회장을 수행한 임원들의 포상 등급이 더 높다. 초안대로
    가면 여론이 뒤집힐 텐데, 이상하게 이 명단이 마음에 든다. 결재판 위에서 붓이 사흘째 움직이지 않고 있다.
  question: 포상 명단, 이대로 결재해야 하겠소?
  then:
    - to: history-draft
      lead: 포상 문제를 그리 매듭지었더니, 이번엔 그 전부를 종이에 박아 남기겠다는 곳이 나타났소.
- id: history-draft
  text: >-
    사사(社史) 편찬실이 전란 기록 초안을 올렸다. 사실만 적는다는 원칙 때문에 본사 이전 검토, 다섯 번의 사의 표명 소동까지 전부 실려 있다. 수정을
    지시하면 '기록에 손대는 회장'이 되고, 그대로 두면 후대가 나를 어떻게 평가할지 뻔하다. 편찬실장은 '기록은 기록일 뿐'이라며 원안을 고수 중이다.
  question: 사사 기록, 손대야 하겠소?
- id: faction-fight
  text: >-
    동인계와 서인계 임원들의 파벌 싸움에 인사가 석 달째 마비됐다. 부장 승진 후보 하나를 두고 양쪽이 상대 후보의 투서를 하루 걸러 올리는 통에, 이제는
    투서 내용이 아니라 발신 파벌부터 확인하는 지경이다. 한쪽을 밀면 반대쪽이 태업할 것이고, 양쪽을 다 달래자니 자리가 모자란다.
  question: 이 파벌 싸움, 어떻게 정리해야 하겠소?
- id: hq-rebuild
  text: >-
    불탄 본사 사옥 재건 예산안이 올라왔다. 총무팀 안은 '회사의 법통과 위엄을 위해 전보다 크게'인데, 전후 복구로 허리띠를 졸라맨 직원들 사이에선
    '월급이나 제때 달라'는 말이 돈다. 사옥을 올리면 위엄은 서지만 민심이 떠나고, 미루면 임시 사옥 셋방살이가 길어진다.
  question: 사옥 재건, 언제 어떤 규모로 해야 하겠소?
