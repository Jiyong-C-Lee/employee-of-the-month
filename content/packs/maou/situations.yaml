# maou 팩 상황 저작 원본. `npm run gen`이 packs.gen.ts에 JSON으로 굽는다.
# 진행 모델 = 랜덤픽 + sparse 링크. 형식은 caocao/situations.yaml 참조.

- id: hero-arrival
  text: >-
    수정구슬 정찰팀 보고에 따르면 용사 파티가 다음 주 마왕성에 도착한다. 구성은 검사, 마법사, 힐러, 그리고 어째서인지 상인 한 명. 정문으로 맞아 위엄을
    보여주자니 최근 방어 승률이 형편없고, 함정으로 소모전을 하자니 함정 예산이 이미 바닥이다. 성문 앞 잔디는 지난 침공 때 타버린 그대로다.
  question: 용사 파티, 어떻게 맞이해야 하겠는가?
  branch:
    options:
      fight: 정면으로 맞서 싸우는 쪽
      trap: 함정·회피·소모전 쪽
    then:
      fight:
        - to: revive-insurance
          lead: 정면으로 붙기로 한 이상 사상자는 각오해야 한다. 그런데 하필 이 시점에, 보험사가 갱신 안내장을 보내왔다.
      trap:
        - to: dungeon-remodel
          lead: 함정으로 맞기로 했는데, 정작 던전 꼴을 둘러보니 한숨부터 나온다. 마침 견적서가 올라왔다.
- id: four-kings-vacancy
  text: >-
    사천왕 중 한 자리가 삼 년째 공석이다. 공고를 내면 '마왕성은 인력난'이라는 소문이 인간계까지 퍼질 것이고, 내부 승진을 시키자니 후보들 실력이 하나같이
    애매하다. 헤드헌터는 경쟁 마왕성의 간부를 빼오자는데 이적료가 성 한 채 값이다. 조직도에는 삼 년째 '충원 예정'이라는 글자만 붙어 있다.
  question: 사천왕 공석, 어떻게 채워야 하겠는가?
- id: dungeon-remodel
  text: >-
    던전 리모델링 견적이 나왔다. 요즘 용사들은 낡은 던전을 '고인물 콘텐츠'라 부르며 공략집만 보고 지나간다 한다. 전면 개보수를 하면 위엄은 살지만 이번
    분기 예산이 전멸하고, 손을 안 대면 다음 침공 때 최단 기록으로 뚫릴 판이다. 시공사는 마감재를 흑요석에서 흑요석 무늬 시트지로 바꾸면 반값이라며 눈치를
    본다.
  question: 던전 리모델링, 어디까지 해야 하겠는가?
- id: princess-vlog
  text: >-
    선대부터 내려온 관행대로 공주를 납치해 왔는데, 인간계 여론이 심상치 않다. '마왕성 감금 브이로그'를 공주가 몰래 찍어 올리는 바람에 성 내부가 낱낱이
    공개됐고, 조회수는 마왕성 공식 채널의 백 배다. 돌려보내자니 관행이 무너지고, 데리고 있자니 매일 성의 치부가 방송된다.
  question: 공주 문제, 어떻게 처리해야 하겠는가?
  branch:
    options:
      return: 공주를 돌려보내는 쪽
      keep: 데리고 있는 쪽
    then:
      return:
        - to: peace-talk
          lead: 공주를 돌려보냈더니 인간계 여론이 눈에 띄게 누그러졌다. 그 틈을 타 용사 측이 뜻밖의 서신을 보내왔다.
      keep:
        - to: official-channel
          lead: 공주 채널 조회수를 매일 보고 있자니 홍보팀 눈빛이 달라졌다. 기어이 기획안을 들고 왔다.
- id: paid-open
  text: >-
    관광청에서 마왕성 일부를 유료 개방하자는 제안서가 왔다. 비수기 던전을 체험형 관광지로 돌리면 연 수익이 침공 방어 예산의 세 배라 한다. 곳간 사정에는
    단비지만, 어둠의 군주가 입장권을 판다는 게 알려지면 마계 사교계에서 웃음거리가 될 것이다. 시식 코너 위치까지 그려진 도면이 이미 첨부돼 있다.
  question: 마왕성 유료 개방, 받아들여야 하겠는가?
- id: peace-talk
  text: >-
    용사 측에서 '대화로 풀자'며 평화 회담을 제안해왔다. 장소는 중립지대 여관, 의제는 침공 스케줄 사전 조율. 응하면 싸우지 않고 방어 실적을 관리할 수
    있지만, 마왕이 용사와 마주 앉아 다과를 나눴다는 사실 자체가 위엄에 치명적이다. 여관 주인은 벌써 '역사적 회담 기념 세트 메뉴'를 준비 중이라 한다.
  question: 평화 회담, 나가야 하겠는가?
- id: slime-union
  text: >-
    말단 슬라임들이 처우 개선을 요구하고 나섰다. 용사 파티의 경험치 셔틀 역할만 수백 년째라며, 최소한 두 번 갈라질 권리와 위험수당을 달라 한다. 들어주면
    인건비가 늘고 다른 종족들도 줄줄이 요구할 것이며, 무시하면 최전선 병력의 사기가 무너진다. 슬라임 대표는 지금 접견실 문틈으로 반쯤 스며들어 대기
    중이다.
  question: 슬라임들의 요구, 어떻게 해야 하겠는가?
- id: golem-lease
  text: >-
    경비 골렘 교체 시기가 왔다. 신형 골렘은 용사 감지 정확도가 세 배지만 가격이 살인적이고, 구형은 요즘 아침마다 시동이 늦게 걸려 침입을 두 번이나
    놓쳤다. 업체는 구독형 렌탈을 권하는데, 어둠의 군주가 경비를 월 구독한다는 건 어딘가 모양이 빠진다. 견적서 하단엔 '첫 달 무료' 스티커가 붙어 있다.
  question: 경비 골렘, 사야 하겠는가 빌려야 하겠는가?
- id: legend-sword
  text: >-
    봉인해 둔 전설의 검이 경매장에 매물로 나왔다는 첩보다. 분명 지하 금고에 있어야 할 물건인데, 장부를 보니 삼 년 전 '창고 정리' 때 고물로 분류돼
    반출됐다. 되사오자니 시세가 궁전 한 채 값이 됐고, 방치하면 언젠가 용사 손에 들어가 우리 성문을 가를 것이다. 경매 마감은 이번 주말이다.
  question: 전설의 검, 되사와야 하겠는가?
- id: spy-hunt
  text: >-
    성내에 첩자가 있다. 침공 때마다 함정 배치도가 용사 측에 새어 나간 정황이 확실하다. 전 직원 심문을 하면 사기가 바닥나고 무고한 마족들이 짐을 쌀
    것이며, 덮어두면 다음 침공도 뚫린다. 감사실이 추린 용의선상에는 하필 근속 300년 이상의 공신들만 올라 있다.
  question: 첩자 색출, 어디까지 해야 하겠는가?
  then:
    - to: legend-sword
      lead: 색출 소동 와중에 창고 장부를 이 잡듯 뒤지다, 더 기막힌 것을 발견했다. 봉인해 뒀던 그 검이— 없다.
- id: dark-aura-bill
  text: >-
    마력 요금 고지서가 나왔다. 성 전체를 덮는 어둠의 오라 연출이 전체 마력 소비의 칠 할을 먹는다는 게 이번에 밝혀졌다. 오라를 끄면 요금이 반으로 줄지만
    마왕성이 대낮처럼 환해지고, 유지하면 다음 달 병사들 월급이 밀린다. 재무팀은 '일몰 후에만 오라 가동' 절충안을 만지작거리고 있다.
  question: 어둠의 오라, 유지해야 하겠는가?
  then:
    - to: slime-union
      lead: 요금 문제로 성 전체가 허리띠를 졸라맸더니, 이번엔 제일 아래에서 아우성이 올라왔다. 슬라임들이다.
- id: fake-goods
  text: >-
    인간계에서 마왕 굿즈가 불티나게 팔리고 있다. 문제는 전부 무허가 짝퉁이고, 마왕 얼굴이 하나같이 귀엽게 그려져 있다는 것이다. 소송을 걸자니 마왕이 인형
    가게와 싸운다는 그림이 우스워지고, 방치하자니 위엄이 솜인형 시세로 거래된다. 참고로 짝퉁 인형의 월 매출은 우리 던전 입장 수익보다 높다.
  question: 짝퉁 굿즈, 어떻게 대응해야 하겠는가?
- id: heir-hero-major
  text: >-
    마왕 2세가 후계 수업을 거부하고 인간계 유학을 선언했다. 전공은 하필 '용사학과'다. 적을 알아야 이긴다는 명분은 그럴듯하지만, 마왕의 아들이 용사 양성
    학교에 다닌다는 게 알려지면 마계가 뒤집힌다. 본인은 이미 원서를 냈고, 합격 통지서가 어제 성문 앞으로 배달됐다.
  question: 2세의 용사학과 유학, 허락해야 하겠는가?
- id: castle-merger
  text: >-
    경쟁 마왕성이 합병을 제안해왔다. 저쪽은 병력이 두 배지만 빚도 두 배고, 합치면 '마계 최대 세력'이라는 간판을 얻는 대신 마왕이 둘이라 서열 정리가
    필요하다. 저쪽 마왕은 '공동 대표 체제'를 말하지만 그 성의 회의실 상석이 하나뿐이라는 건 다들 아는 사실이다.
  question: 마왕성 합병, 받아들여야 하겠는가?
- id: revive-insurance
  text: >-
    부활 보험 갱신 시즌이다. 보험사는 마왕성의 최근 패전 이력을 근거로 보험료를 세 배 올려 불렀다. 갱신하면 예산이 휘청이고, 해지하면 다음 침공에서
    쓰러진 간부들을 자비로 부활시켜야 한다. 약관 구석에는 '용사에 의한 소멸은 특약 가입 시에만 보장'이라는 문구가 작게 적혀 있다.
  question: 부활 보험, 갱신해야 하겠는가?
- id: recruit-drought
  text: >-
    신입 마족 공채 지원율이 역대 최저다. 요즘 젊은 마족들은 워라밸이 좋은 던전이나 재택 저주 업무를 선호하고, 마왕성은 '침공 때마다 야근하는 곳'으로
    소문이 났다. 채용 설명회에서 나온 질문의 팔 할이 '용사가 오면 도망쳐도 되나요'였다. 인사팀은 복지 강화안과 함께 사표를 만지작거리고 있다.
  question: 인력난, 어떻게 풀어야 하겠는가?
- id: sealed-god
  text: >-
    성 지하에서 초고대 마신이 봉인된 석관이 발견됐다. 풀면 전력이 단숨에 마계 최강이 되지만, 석관에는 '깨우는 자를 가장 먼저 잡아먹음'이라고 선대의
    필체로 적혀 있다. 그냥 두자니 용사가 먼저 발견해 아군으로 삼을까 걱정이다. 석관은 지금도 가끔 코 고는 소리를 낸다.
  question: 마신의 석관, 열어야 하겠는가?
- id: official-channel
  text: >-
    홍보팀이 마왕성 공식 채널 개설을 제안했다. 요즘 공포는 입소문이 아니라 알고리즘을 타야 퍼진다는 것이다. 첫 콘텐츠 기획안은 '마왕의 하루 브이로그'와
    '사천왕 먹방'. 조회수는 보장이라는데, 어둠의 군주가 구독과 좋아요를 구걸하는 순간 무언가 끝나는 기분이 든다.
  question: 공식 채널, 열어야 하겠는가?
- id: shareholder-meeting
  text: >-
    용사에게 세 번 연속 패배한 기념비적 시즌이 끝났다. 마계 언론은 '마왕성의 시대는 갔다'는 특집을 내보냈고, 주주 마족들은 임시 총회를 소집했다. 대대적
    쇄신안을 내자니 사실상 패배 인정이고, 정면 반박을 하자니 반박할 전적이 없다. 총회는 사흘 뒤고, 연설문은 아직 백지다.
  question: 주주 총회, 뭐라고 연설해야 하겠는가?
- id: retired-maou
  text: >-
    은퇴한 선대 마왕이 성에 놀러 왔다가 눌러앉았다. 매일 회의에 참견하며 '나 때는 용사를 아침으로 먹었다'는 무용담을 늘어놓는데, 기록을 찾아보면 선대도
    용사에게 성을 두 번 뺏겼다. 내보내자니 불효라는 말이 나올 것이고, 두자니 회의가 두 배로 길어진다. 오늘도 상석 옆에 의자를 붙이고 앉아 계신다.
  question: 선대 마왕님, 어떻게 모셔야 하겠는가?
